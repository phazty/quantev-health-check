<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantev Health Check Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages SPA: consume redirect stored by 404.html
      (function () {
        var redirect = sessionStorage.getItem("redirect");
        if (redirect && redirect !== "/") {
          sessionStorage.removeItem("redirect");
          window.history.replaceState(null, "", redirect);
        }
      })();
    </script>
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("quantev-ui-state");
          const theme = stored ? JSON.parse(stored)?.state?.theme : null;
          if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {}
      })();
    </script>
    <script type="module" crossorigin src="/quantev-health-check/assets/index-Bek1rPFQ.js"></script>
    <link rel="stylesheet" crossorigin href="/quantev-health-check/assets/index-CAKzyGQm.css">
  </head>

    <div id="root"></div>
  </body>
</html>
